meta:
  spec_version: 0.7.0
  updated: '2026-08-12'
  intro: 'This summary lists the producer (and bilateral) conformance requirements. Conformance is capability-scoped: a producer satisfies the rules that apply to the capabilities it declares in STREAM_METADATA (ordering_scope, transaction_interleaving, transaction_boundaries, session_aware, schema_delivery, sequence_continuity, bidirectional, ddl_capture), not necessarily every rule in the document (see Section 16). Consumer obligations (C-* and consumer-side R-*) are non-normative and are defined as a consumer parse pipeline in Appendix A; they are not listed here. SHOULD requirements are register-only -- see the relevant section for the complete normative text.'
requirements:
- id: P-ORD-1
  level: MUST
  requirement: Emit events in source commit order (grouped by transaction, in source commit sequence; cdctxorder within each)
  who: Producer
  sections:
  - '6.1'
- id: P-ORD-2
  level: MUST
  requirement: All events in same transaction carry same cdcxid
  who: Producer
  sections:
  - '6.1'
- id: P-ORD-3
  level: MUST
  requirement: cdctxorder is 0-based, monotonically increasing within transaction
  who: Producer
  sections:
  - '6.1'
- id: P-ORD-4
  level: MUST
  requirement: OBJECT_METADATA MUST precede first DML for a table
  who: Producer
  sections:
  - '4.1'
  - '6.1'
- id: P-ORD-5
  level: MUST
  requirement: DML MUST conform to the current emission schema; new OBJECT_METADATA MUST precede first DML under any changed emission schema (following the DDL event where one is emitted)
  who: Producer
  sections:
  - '4.1'
  - '6.1'
- id: P-ORD-7
  level: MUST
  requirement: 'Multi-table TRUNCATE: one TRUNCATE event per named table; all events share the same cdcxid with sequential cdctxorder values'
  who: Producer
  sections:
  - '6.1'
  - 9.2.3
- id: P-TYPE-1
  level: MUST
  requirement: source_type carries verbatim DDL -- no normalization
  who: Producer
  sections:
  - '6.2'
- id: P-TYPE-2
  level: MUST
  requirement: logical_type from OpenCDC canonical vocabulary
  who: Producer
  sections:
  - '6.2'
- id: P-TYPE-3
  level: MUST
  requirement: DML values encoded per logical_type wire rules
  who: Producer
  sections:
  - '6.2'
- id: P-TYPE-4
  level: MUST
  requirement: No silent truncation or precision loss
  who: Producer
  sections:
  - '6.2'
- id: P-LOB-1
  level: MUST
  requirement: _null_columns and _lob_overflow distinguish null vs uncaptured
  who: Producer
  sections:
  - '6.3'
- id: P-LOB-2
  level: MUST
  requirement: _null_columns and _lob_overflow present in every DML (even empty)
  who: Producer
  sections:
  - '6.3'
- id: P-DML-1
  level: MUST
  requirement: DML before/after value objects carry column data values only; source_type, logical_type, parameters, and nullability MUST NOT appear in row value objects
  who: Producer
  sections:
  - '4.1'
  - '5'
- id: P-CONN-1
  level: MUST
  requirement: 'When session-scoped re-emission is the effective reconnect mechanism (`session_aware: true` with Schema on Reconnect active), the producer MUST emit current OBJECT_METADATA for all active tables on connection before resuming data delivery. Sessionless producers satisfy reconnect coverage by other means per Section 4.4 and P-SCHEMA-2 and are exempt from this rule.'
  who: Producer
  sections:
  - '6.4'
  binds_when:
    session_aware: true
    schema_on_reconnect: true
- id: P-LOOP-1
  level: MUST
  requirement: 'Loop suppression (BD; when `bidirectional: true` declared): MUST NOT re-emit a change toward the ingress counterpart recovered from the apply-time mark, and MUST NOT emit a marked change whose recorded original origin is this deployment; native unmarked changes are unaffected; emitted changes carry the original origin in source'
  who: Producer
  sections:
  - '3.4'
  qualifier: BD
  binds_when:
    bidirectional: true
- id: T-COMPLETE
  level: MUST
  requirement: Transaction complete when new cdcxid (or HEARTBEAT) observed after last event in group
  who: Producer
  sections:
  - '7.3'
- id: T-NOINTERLEAVE
  level: MUST NOT
  requirement: 'When `transaction_interleaving: "none"` is declared, events of different transactions MUST NOT be interleaved within each emission channel; stream-wide when `ordering_scope: "stream"` is also declared. Producers declaring `transaction_interleaving: "possible"` are exempt and MUST emit TRX_COMMIT markers instead (P-TRX-1).'
  who: Producer
  sections:
  - '7.3'
  binds_when:
    transaction_interleaving: none
- id: T-ORDER
  level: MUST
  requirement: cdctxorder MUST be gapless and monotonic within a transaction
  who: Producer
  sections:
  - '7.3'
- id: T-HEARTBEAT
  level: MUST
  requirement: Producer MUST emit HEARTBEAT within heartbeat_interval_seconds after idle transaction
  who: Producer
  sections:
  - '7.3'
- id: P-IDEM-1
  level: MUST
  requirement: Stable UUID id assigned at creation; same id during replay
  who: Producer
  sections:
  - '10.2'
- id: R-POS-0
  level: MUST
  requirement: 'Ordering is guaranteed within a transaction by cdctxorder; the CloudEvents sequence field yields cross-transaction total order only within a session where ordering_scope: "stream" is declared and the consumer receives it as one ordered channel (Section 3.3), otherwise per-channel order plus cdcxid/cdctxorder/markers applies; partitionkey is an optional routing hint, not the ordering anchor'
  who: Producer
  sections:
  - '7.2'
- id: R-POS-2
  level: MUST
  requirement: Provide cdcpos on resume; producer replays from schema event
  who: Both
  sections:
  - '7.2'
- id: R-POS-3
  level: MUST
  requirement: cdcpos is the authoritative resume handle; the payload pos object serves consumer-side ordering logic; both MUST be maintained
  who: Both
  sections:
  - '7.2'
- id: R-POS-4
  level: MUST
  requirement: Replay preserves original event order
  who: Producer
  sections:
  - '7.2'
- id: R-POS-5
  level: MUST
  requirement: At-least-once delivery is the minimum guarantee; duplicate events are permitted during replay
  who: Producer
  sections:
  - '7.2'
- id: P-TRX-7
  level: MUST
  requirement: Producers that do not deliver directly to consumers SHOULD emit TRX_COMMIT markers regardless of interleaving declaration
  who: Producer
  sections:
  - '9.5'
  - 2.2a
- id: S-AUTH-2
  level: MUST NOT
  requirement: Credentials MUST NOT be embedded in event payloads or CloudEvents extension attributes
  who: Producer
  sections:
  - '13.1'
- id: P-SNAP-1
  level: MUST
  requirement: 'Initial load: SNAPSHOT events for a table precede its first steady-state DML; producer signals initial-load completion (snapshot_complete or first DML cdcxid) and declares the initial-load phase in STREAM_METADATA'
  who: Producer
  sections:
  - '9.3'
- id: P-SCHEMA-1
  level: MUST
  requirement: schema_on_change MUST always be true in STREAM_METADATA schema_delivery
  who: Producer
  sections:
  - '4.4'
  - 4.5.1
- id: P-SCHEMA-2
  level: MUST
  requirement: At least one of schema_on_reconnect or schema_on_each_event MUST be present and true; defaults resolve to false and do not satisfy coverage
  who: Producer
  sections:
  - '4.4'
- id: P-SCHEMA-3
  level: MUST
  requirement: schema_delivery object MUST be present in every STREAM_METADATA event
  who: Producer
  sections:
  - '4.4'
  - '9.4'
- id: P-SCHEMA-4
  level: MUST
  requirement: 'If schema_on_reconnect: false, then schema_on_each_event MUST be true'
  who: Producer
  sections:
  - '4.4'
  - 4.5.2
- id: P-SCHEMA-5
  level: MUST
  requirement: 'If schema_on_each_event: true, _schema object MUST be present in every DML data payload'
  who: Producer
  sections:
  - 4.5.3
- id: P-SCHEMA-6
  level: MUST
  requirement: When schema_by_reference is active, DML and DDL events MUST carry cdcschemauri holding a resolvable URI content-equivalent to the governing OBJECT_METADATA; dataschema continues to carry the OBJECT_METADATA id
  who: Producer
  sections:
  - '3.3'
  - 4.5.4
  binds_when:
    schema_by_reference: true
- id: P-SEQ-1
  level: MUST
  requirement: CloudEvents sequence value MUST be a non-negative decimal integer encoded as string, no leading zeros
  who: Producer
  sections:
  - '3.3'
- id: P-SEQ-2
  level: MUST
  requirement: CloudEvents sequence MUST be monotonically increasing within a session; gaps are permitted
  who: Producer
  sections:
  - '3.3'
- id: P-SEQ-3
  level: MUST NOT
  requirement: CloudEvents sequence MUST NOT be derived from source database positions; it is producer-assigned
  who: Producer
  sections:
  - '3.3'
- id: P-SEQ-4
  level: MUST
  requirement: sequence_continuity MUST be present in every STREAM_METADATA event
  who: Producer
  sections:
  - 7.4.1
  - '9.4'
- id: P-SEQ-5
  level: MUST
  requirement: When LSN or sequence continuity breaks mid-session, producer MUST emit HEARTBEAT with lsn_reset or sequence_reset
  who: Producer
  sections:
  - 7.4.2
- id: P-SEQ-6
  level: MUST
  requirement: 'pos.lsn MUST be monotonically increasing within a session unless lsn_reset: true or sequence_continuity: "reset" or "best_effort" has been signaled; comparability across session or reset boundaries is not guaranteed'
  who: Producer
  sections:
  - '7.1'
  - '7.4'
- id: P-TRUNC-1
  level: MUST
  requirement: When emitting a TRUNCATE event, before and after MUST be null; _null_columns and _lob_overflow MUST be present and empty; primary_key MUST be populated
  who: Producer
  sections:
  - 9.2.4
- id: P-TRUNC-2
  level: MUST
  requirement: For multi-table TRUNCATE (single SQL statement naming multiple tables), producer MUST emit one TRUNCATE event per table; all events MUST share the same cdcxid; cdctxorder MUST be sequential (0, 1, 2, ...)
  who: Producer
  sections:
  - '6.1'
  - 9.2.3
  see_also:
  - P-ORD-7
- id: P-TRUNC-3
  level: MUST
  requirement: For non-transactional TRUNCATE (Oracle, MySQL), producer MUST assign a synthetic cdcxid that is unique, stable across replay, and documented
  who: Producer
  sections:
  - 9.2.2
  - '7.3'
- id: P-TRUNC-4
  level: MUST NOT
  requirement: If a producer emits TRUNCATE events and the source engine exposes truncate execution options, the producer SHOULD populate truncate_details; producers MUST NOT fabricate flag values that cannot be determined from the capture layer
  who: Producer
  sections:
  - 9.2.5
  - '2.8'
- id: P-SCOPE-1
  level: MUST
  requirement: Declare ordering_scope ("stream"/"channel") in STREAM_METADATA
  who: Producer
  sections:
  - 2.2a
  - '9.4'
- id: P-ILV-1
  level: MUST
  requirement: Declare transaction_interleaving ("none"/"possible") in STREAM_METADATA
  who: Producer
  sections:
  - 2.2a
  - '9.4'
- id: P-SCOPE-2
  level: MUST
  requirement: ordering_scope MUST be "channel" unless one total order across every event is structurally enforced (conservative default)
  who: Producer
  sections:
  - 2.2a
- id: P-ILV-2
  level: MUST
  requirement: transaction_interleaving MUST be "possible" unless transaction contiguity at every consumption point is guaranteed (conservative default)
  who: Producer
  sections:
  - 2.2a
- id: P-TRX-1
  level: MUST
  requirement: When transaction_interleaving is "possible", transaction_boundaries MUST be commit_all and TRX_COMMIT MUST be emitted for every transaction; commit_multi_event is valid only under "none" interleaving, which MAY also use none
  who: Producer
  sections:
  - '7.3'
  - '9.5'
  binds_when:
    transaction_interleaving: possible
- id: P-TRX-2
  level: MUST
  requirement: TRX_COMMIT event_count = count of distinct cdctxorder ordinals of DML and DDL events (DDL counts; lifecycle events do not)
  who: Producer
  sections:
  - '9.5'
- id: P-TRX-3
  level: MUST
  requirement: TRX_COMMIT MUST carry cdcxid and MUST NOT carry cdctxorder; correlation is by cdcxid only
  who: Producer
  sections:
  - '9.5'
- id: P-TRX-4
  level: MUST
  requirement: When TRX_COMMIT distribution is present, per-subject counts MUST sum to event_count
  who: Producer
  sections:
  - '9.5'
- id: R-POS-6
  level: MUST
  requirement: A replay window including any event of a transaction MUST also redeliver that transaction's TRX_COMMIT with stable id and identical event_count
  who: Producer
  sections:
  - '7.2'
  - '9.5'
- id: P-DDL-1
  level: MUST
  requirement: 'When ddl_capture is not "none": emit a DDL event for every source DDL operation changing a captured table''s emission schema, including creation and drop of a captured table, in source commit order with DML; non-schema-changing DDL events MAY be emitted and never trigger OBJECT_METADATA or schema_version'
  who: Producer
  sections:
  - '2.5'
  - '8'
  binds_when:
    ddl_capture:
    - verbatim
    - structural
- id: P-DDL-2
  level: MUST
  requirement: 'Applies to every DDL event emitted in any mode. Under "verbatim": ddl.statement carries verbatim source text (statement_truncated permitted). Under "structural": the ddl object is empty -- statement omitted; synthesized SQL is non-conformant. Under "none": an opportunistic DDL event takes one of these two shapes. A producer MUST NOT emit a ddl.* event for a change that was not a source DDL operation'
  who: Producer
  sections:
  - '8'
  - '8.1'
  binds_when:
    ddl_capture:
    - verbatim
    - structural
    - none
- id: P-COMPAT-1
  level: MUST
  requirement: meta.* lifecycle types are additive; producers MUST NOT repurpose existing type names; the dml.* and ddl.* operation vocabularies are closed and extended only by specification revision
  who: Producer
  sections:
  - 2.2a
  - '3.2'
- id: P-ORD-6
  level: SHOULD
  requirement: All events of same transaction SHOULD share same partitionkey (advisory routing hint; not the ordering anchor)
  who: Producer
  sections:
  - '3.3'
  - '6.1'
- id: C-TYPE-1
  level: MUST
  requirement: logical_type is the authoritative basis for decoding DML column values; consumers MUST NOT use source_type for decoding
  who: Consumer
  sections:
  - '4.3'
- id: C-DML-1
  level: MUST
  requirement: Absent column in partial before/after image MUST be interpreted as unchanged -- not null and not deleted
  who: Consumer
  sections:
  - '5.4'
- id: C-HB-1
  level: SHOULD
  requirement: Consumer SHOULD monitor HEARTBEAT receipt to distinguish idle stream from broken stream (see Appendix A.8 HEARTBEAT lag monitoring)
  who: Consumer
  sections:
  - Appendix A.8
- id: C-ORD-1
  level: MUST
  requirement: Apply events in cdctxorder sequence within transaction
  who: Consumer
  sections:
  - Appendix A.1
- id: C-ORD-2
  level: MUST
  requirement: Apply transactions in stream order; buffer out-of-order events
  who: Consumer
  sections:
  - Appendix A.1
- id: C-ORD-3
  level: MUST NOT
  requirement: 'On unknown dataschema: pause and request schema, or reject -- MUST NOT infer'
  who: Consumer
  sections:
  - Appendix A.1
- id: C-SCHEMA-1
  level: MUST
  requirement: Detect schema version changes
  who: Consumer
  sections:
  - Appendix A.2
- id: C-SCHEMA-2
  level: MUST
  requirement: Update schema cache on OBJECT_METADATA receipt
  who: Consumer
  sections:
  - Appendix A.2
- id: C-SCHEMA-3
  level: MUST
  requirement: Do not apply DML with stale schema
  who: Consumer
  sections:
  - Appendix A.2
- id: C-IDEM-1
  level: MUST
  requirement: Deduplicate on (source, id)
  who: Consumer
  sections:
  - Appendix A.3
  - A.7
- id: C-IDEM-2
  level: MUST
  requirement: Discard duplicates silently without error
  who: Consumer
  sections:
  - Appendix A.3
- id: C-IDEM-3
  level: SHOULD
  requirement: Idempotent apply semantics at the target level
  who: Consumer
  sections:
  - Appendix A.3
- id: C-LOB-1
  level: MUST
  requirement: Check _lob_overflow before interpreting LOB null
  who: Consumer
  sections:
  - Appendix A.4
- id: C-LOB-2
  level: MUST
  requirement: Do not treat lob_overflow null as schema-level null
  who: Consumer
  sections:
  - Appendix A.4
- id: C-VAL-1
  level: MUST
  requirement: Validate DML against json_schema; reject on failure
  who: Consumer
  sections:
  - Appendix A.5
- id: C-VAL-2
  level: MUST
  requirement: Reject events with unrecognized fields
  who: Consumer
  sections:
  - Appendix A.5
- id: C-VAL-3
  level: SHOULD
  requirement: Verify CloudEvents envelope compliance for every received event
  who: Consumer
  sections:
  - Appendix A.5
- id: R-POS-1
  level: MUST
  requirement: Persist (pos.lsn, pos.lsn_offset) as structured resume position; persist cdcpos as primary replay handle
  who: Consumer
  sections:
  - '7.2'
- id: S-AUTHZ-1
  level: SHOULD
  requirement: 'Table-level access control: consumers receive events only for authorized tables'
  who: Producer
  sections:
  - '13.1'
- id: S-AUTHZ-2
  level: SHOULD
  requirement: Column-level masking or exclusion for sensitive columns, per consumer identity
  who: Producer
  sections:
  - '13.1'
- id: C-SCHEMA-4
  level: MUST
  requirement: Consumer MUST read schema_delivery in STREAM_METADATA and adapt schema acquisition behavior
  who: Consumer
  sections:
  - '4.4'
- id: C-SEQ-1
  level: MUST NOT
  requirement: Consumer MUST NOT interpret CloudEvents sequence gaps as evidence of dropped events
  who: Consumer
  sections:
  - '3.3'
- id: C-SEQ-2
  level: MUST NOT
  requirement: Consumer MUST NOT compare pos.lsn values across sessions when sequence_continuity is "reset" or "best_effort"
  who: Consumer
  sections:
  - 7.4.1
- id: C-SEQ-3
  level: MUST
  requirement: Consumer MUST treat CloudEvents sequence counter as restarted after reconnect
  who: Consumer
  sections:
  - '3.3'
  - '7.4'
- id: C-SEQ-4
  level: MUST
  requirement: Consumer MUST use cdctxorder for intra-transaction ordering, CloudEvents sequence for cross-table total ordering, and (pos.lsn, pos.lsn_offset) for replay positioning
  who: Consumer
  sections:
  - '3.3'
  - '7.1'
  - '7.2'
- id: C-TRUNC-1
  level: MUST
  requirement: Consumers MUST treat any TRUNCATE event as semantically equivalent to deletion of all rows in the named table, regardless of truncate_details presence
  who: Consumer
  sections:
  - 9.2.1
  - Appendix A.6
- id: C-TRUNC-2
  level: SHOULD
  requirement: Consumers performing correctness-sensitive (same-engine) replication SHOULD inspect truncate_details.cascade and truncate_details.sequence_reset when present and act on non-"not_applicable" values
  who: Consumer
  sections:
  - Appendix A.6
- id: C-TRUNC-3
  level: MUST NOT
  requirement: Consumers performing target-agnostic apply MAY ignore truncate_details; consumers MUST NOT reject a TRUNCATE event solely because truncate_details is present
  who: Consumer
  sections:
  - Appendix A.6
- id: C-TRUNC-4
  level: MUST
  requirement: Duplicate TRUNCATE events (same (source, id)) MUST be deduplicated and MUST NOT be re-applied
  who: Consumer
  sections:
  - Appendix A.6
- id: P-DDL-3
  level: SHOULD
  requirement: 'A producer whose source exposes DDL for captured tables in its change interface SHOULD declare and provide at least ddl_capture: "structural"'
  who: Producer
  sections:
  - 2.2a
  - '8'
  binds_when:
    ddl_capture: none
- id: C-COMP-1
  level: SHOULD
  who: Consumer
  requirement: 'Conservative Composition: unless events are received directly from the producer or a claimed transport binding profile covers delivery, treat delivered guarantees as ordering_scope "channel" and transaction_interleaving "possible" regardless of the emission declaration; do not upgrade based on observed transport topology alone'
  sections:
  - Appendix A.1
- id: P-TRX-6
  level: SHOULD
  who: Producer
  requirement: Declare transaction_visibility; when absent the value defaults to "committed_only"
  sections:
  - 2.2a
  - '9.4'
- id: C-COMPAT-1
  level: SHOULD
  requirement: Ignore unrecognized meta.* lifecycle types; never silently ignore unrecognized dml.*/ddl.* types -- surface an error
  who: Consumer
  sections:
  - A.8
- id: C-ILV-1
  level: SHOULD
  requirement: Refuse and log a stream declaring transaction_interleaving "possible" with transaction_boundaries "none" (non-conformant combination)
  who: Consumer
  sections:
  - A.10
- id: C-KEY-1
  level: SHOULD
  requirement: Key rows on the table primary_key from OBJECT_METADATA, not on partitionkey; fall back to the full row image where no primary key exists
  who: Consumer
  sections:
  - A.4
- id: C-TRX-1
  level: SHOULD
  requirement: Read transaction_visibility; treat absent as committed_only and fail closed on an unrecognized value
  who: Consumer
  sections:
  - A.10
- id: C-TRX-2
  level: SHOULD
  requirement: 'Completeness algorithm: buffer by cdcxid and record distinct cdctxorder ordinals; complete iff every ordinal 0..event_count-1 is held at TRX_COMMIT'
  who: Consumer
  sections:
  - A.10
- id: C-TRX-3
  level: SHOULD
  requirement: 'Mode awareness: under commit_multi_event a markerless single-event transaction is expected, not a gap; under commit_all every transaction carries a marker'
  who: Consumer
  sections:
  - A.10
matrix:
- capability: Schema delivery before first DML
  producer: MUST
  consumer: MUST
  delivery_layer: null
  sections:
  - '4.1'
  req_ids:
  - P-ORD-4
  - C-ORD-1
- capability: Schema re-emission on emission-schema change
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '4.1'
  req_ids:
  - P-ORD-5
- capability: DDL event coverage when ddl_capture declared other than "none" (incl. CREATE/DROP of captured tables)
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '8'
  req_ids:
  - P-DDL-1
- capability: DDL statement fidelity by declared mode (verbatim / structural / opportunistic under none)
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '8.1'
  req_ids:
  - P-DDL-2
- capability: cdcschemauri present and content-equivalent when schema_by_reference active
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '3.3'
  - 4.5.4
  req_ids:
  - P-SCHEMA-6
- capability: 'Reconnect coverage: at least one of schema_on_reconnect / schema_on_each_event present and true'
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '4.4'
  req_ids:
  - P-SCHEMA-2
- capability: 'Schema re-emission on reconnect (when `session_aware: true` and Schema on Reconnect is the effective mechanism)'
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '6.4'
  req_ids:
  - P-CONN-1
- capability: Closed-world schema enforcement
  producer: MUST
  consumer: MUST
  delivery_layer: null
  sections:
  - '4.2'
  req_ids:
  - C-VAL-2
- capability: source_type verbatim DDL
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '4.3'
  req_ids:
  - P-TYPE-1
- capability: logical_type from OpenCDC vocabulary
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '4.3'
  req_ids:
  - P-TYPE-2
- capability: Values-only DML payloads (no per-row types)
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '5'
  req_ids:
  - P-DML-1
- capability: _null_columns and _lob_overflow present in every DML
  producer: MUST
  consumer: null
  delivery_layer: null
  sections:
  - '5.2'
